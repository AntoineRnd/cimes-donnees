name: Extraction des cimes (OpenStreetMap)

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Extrait Geofabrik (ex. europe/france/rhone-alpes)"
        default: "europe/france/rhone-alpes"
        required: true

permissions:
  contents: write

jobs:
  extraire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Outils (osmium)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install --quiet "h3>=4,<5" pillow
          osmium --version

      - name: Téléchargement de l'extrait OpenStreetMap (jamais enregistré dans le dépôt)
        run: |
          set -euo pipefail
          R="${{ github.event.inputs.region }}"
          B="https://download.geofabrik.de"
          # nouvelle adresse Geofabrik (dossier par région), sinon l'ancienne
          for URL in "$B/$R/$(basename "$R")-latest.osm.pbf" "$B/$R-latest.osm.pbf"; do
            echo "Essai : $URL"
            if curl -fL --retry 3 --retry-delay 10 -o /tmp/region.osm.pbf "$URL"; then echo "Source : $URL"; break; fi
            rm -f /tmp/region.osm.pbf
          done
          test -s /tmp/region.osm.pbf || { echo "Téléchargement impossible"; exit 1; }
          ls -lh /tmp/region.osm.pbf
          osmium fileinfo /tmp/region.osm.pbf | grep -E "timestamp|Bounding" || true

      - name: Filtrage (sommets, cols, collines, belvédères)
        run: |
          set -euo pipefail
          osmium tags-filter /tmp/region.osm.pbf \
            n/natural=peak,saddle,hill n/mountain_pass=yes n/tourism=viewpoint \
            -o /tmp/cimes.osm.pbf --overwrite
          osmium export /tmp/cimes.osm.pbf -f geojsonseq --add-unique-id=type_id -o /tmp/cimes.geojsonseq --overwrite
          wc -l /tmp/cimes.geojsonseq

      - name: Fichier léger pour Cimes + contrôles
        run: |
          set -euo pipefail
          SLUG=$(basename "${{ github.event.inputs.region }}")
          python3 scripts/extract.py /tmp/cimes.geojsonseq "data/$SLUG/cimes.json" "$SLUG"
          ls -lh "data/$SLUG/"

      - name: Lieux à découvrir (cimes, nature, patrimoine, curiosités) + photos Wikidata
        run: |
          set -euo pipefail
          SLUG=$(basename "${{ github.event.inputs.region }}")
          osmium tags-filter /tmp/region.osm.pbf \
            n/natural=peak,saddle,hill n/mountain_pass=yes n/tourism=viewpoint \
            nwr/historic=castle,fort,ruins,tower,city_gate,citywalls,archaeological_site,monument,manor,memorial \
            nwr/man_made=tower nwr/leisure=park,garden,nature_reserve \
            nwr/natural=water,cave_entrance,arch,rock,stone,gorge,waterfall,tree nwr/waterway=waterfall \
            nwr/tourism=attraction nwr/amenity=fountain \
            -o /tmp/lieux.osm.pbf --overwrite
          osmium export /tmp/lieux.osm.pbf -f geojsonseq --add-unique-id=type_id -o /tmp/lieux.geojsonseq --overwrite
          ls -lh /tmp/lieux.geojsonseq
          python3 scripts/lieux.py /tmp/lieux.geojsonseq "data/$SLUG/lieux" "$SLUG"
          rm -f /tmp/lieux.geojsonseq /tmp/lieux.osm.pbf
          du -sh "data/$SLUG/lieux"

      - name: Zones accessibles à pied (cellules H3, par tuiles)
        run: |
          set -euo pipefail
          SLUG=$(basename "${{ github.event.inputs.region }}")
          osmium tags-filter /tmp/region.osm.pbf \
            w/highway=footway,path,track,pedestrian,living_street,residential,service,unclassified,tertiary,tertiary_link,secondary,secondary_link,primary,primary_link,steps,cycleway,bridleway,road \
            -o /tmp/voies.osm.pbf --overwrite
          osmium export /tmp/voies.osm.pbf -f geojsonseq --geometry-types=linestring,polygon -o /tmp/voies.geojsonseq --overwrite
          ls -lh /tmp/voies.geojsonseq
          python3 scripts/acces.py /tmp/voies.geojsonseq "data/$SLUG/acces" "$SLUG"
          rm -f /tmp/voies.geojsonseq /tmp/voies.osm.pbf
          du -sh "data/$SLUG/acces"

      - name: Enregistrement du résultat dans le dépôt
        run: |
          set -euo pipefail
          git config user.name "cimes-bot"
          git config user.email "cimes-bot@users.noreply.github.com"
          git add data/
          git commit -m "Extraction des cimes : ${{ github.event.inputs.region }}" || echo "Rien de nouveau"
          git push
